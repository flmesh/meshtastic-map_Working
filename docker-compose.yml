services:

  # listens to mqtt packets and saves to database
  meshtastic-mqtt:
    depends_on:
      database:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./Dockerfile
    command: /app/docker/mqtt.sh
    environment:
      DATABASE_URL: "mysql://root:password@database:3306/meshtastic-map?connection_limit=100"
      MQTT_OPTS: "${MQTT_OPTS:-}" # add any custom mqtt.js options here

  # runs the web map ui
  meshtastic-map:
    depends_on:
      database:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./Dockerfile
    command: /app/docker/map.sh
    ports:
      - ${MAP_PORT:-8080}:8080/tcp
    environment:
      DATABASE_URL: "mysql://root:password@database:3306/meshtastic-map?connection_limit=100"
      MAP_OPTS: "" # add any custom index.js options here

  # runs the database to store everything from mqtt
  database:
    image: bitnami/mariadb
    ports:
      - ${DB_PORT:-3306}:3306/tcp
    environment:
      MARIADB_DATABASE: "meshtastic-map"
      MARIADB_ROOT_PASSWORD: "password"
    volumes:
      - database_data:/bitnami/mariadb
    healthcheck:
      # bitnami's own healthcheck script currently fails with "TLS/SSL error: method not
      # supported" on some image builds (their mysqladmin/mariadb-admin client attempts TLS
      # even over the local unix socket, and the image's TLS library rejects it) - ping over
      # the socket with TLS explicitly disabled instead, falling back to their original script
      # so this keeps working with no changes needed if/when that gets fixed upstream
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MARIADB_ROOT_PASSWORD" mariadb-admin --socket=/opt/bitnami/mariadb/tmp/mysql.sock -uroot --skip-ssl ping || /opt/bitnami/scripts/mariadb/healthcheck.sh']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 5s

volumes:
  database_data:
